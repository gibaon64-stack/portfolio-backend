services:
  - type: web
    name: mabrixel-portfolio-api
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: flask --app run:app db upgrade && flask --app run:app seed-content && gunicorn run:app --bind 0.0.0.0:$PORT
    initialDeployHook: flask --app run:app provision-admin
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: mabrixel-portfolio-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FRONTEND_ORIGIN
        value: https://portfolio-mabrixel.netlify.app
      - key: INITIAL_ADMIN_EMAIL
        value: ian@gmail.com
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: CLOUDINARY_REQUIRED
        value: "1"
      - key: COOKIE_SECURE
        value: "1"
      - key: COOKIE_SAMESITE
        value: None
      - key: RATELIMIT_STORAGE_URI
        value: memory://

databases:
  - name: mabrixel-portfolio-db
    databaseName: mabrixel
    user: mabrixel
    plan: free
    region: frankfurt